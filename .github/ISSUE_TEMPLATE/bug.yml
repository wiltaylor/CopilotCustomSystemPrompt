name: Bug report
description: Report reproducible incorrect behaviour.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value:
        Thanks for reporting a bug. Remove secrets and personal information
        before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description:
        Provide the smallest sequence that consistently reproduces the problem.
      placeholder: |
        1. Install ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: package-version
    attributes:
      label: Package version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: copilot-version
    attributes:
      label: Copilot CLI version
      description: Run `copilot --version`.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Include your operating system and Node.js version.
      placeholder: Ubuntu 24.04, Node.js 22.18.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description:
        Paste relevant logs or terminal output. Remove tokens and other
        sensitive values.
      render: shell
